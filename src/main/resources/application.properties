# RabbitMQ Configuration
# Connection settings for RabbitMQ (default values for local development)
# These will be used when creating the ConnectionFactory programmatically
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest

# Route enablement flags. All routers are disabled unless explicitly enabled.
app.route.exercise1.enabled=false
app.route.exercise2.enabled=false
app.route.exercise3.enabled=false
app.route.exercise4.enabled=false
app.route.exercise5.enabled=false
app.route.training.enabled=false
app.route.gameofthrones.enabled=false
